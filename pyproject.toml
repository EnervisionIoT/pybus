[project]
name = "pybus"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "莊欽淯", email = "61406288+chinyue1910@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "colorlog>=6.10.1",
    "dependency-injector>=4.49.0",
    "google-genai>=1.71.0",
    "inflection>=0.5.1",
    "pydantic-settings>=2.13.1",
    "pydantic>=2.12.5",
    "redis>=7.4.0",
    "minio>=7.2.20",
    "confluent-kafka>=2.14.0",
]

[project.optional-dependencies]
sqlalchemy = ["pgvector>=0.4.2", "sqlalchemy>=2.0.49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "coverage>=7.13.5",
    "mypy>=1.18.2",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.9",
    # No module here imports grpc today -- unlike the five services, pybus
    # serves no RPC. Carried anyway so the six packages' type-checking dev
    # groups are one list, and so the day something here does reach for grpc
    # it is checked rather than silently untyped.
    "types-grpcio>=1.0.0.20250914",
    # The same two the `sqlalchemy` extra carries, repeated here because the
    # test suite cannot run without them: `pybus.container.application`
    # imports sqlalchemy unconditionally, so the extra is optional to a
    # consumer and mandatory to this repository's own tests. `uv sync &&
    # uv run pytest` failed outright in a fresh clone until this was added
    # -- it only ever worked because the workspace this package used to live
    # in had a consumer that pulled the extra in.
    "pgvector>=0.4.2",
    "sqlalchemy>=2.0.49",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 20

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.mypy]
files = ["src"]
# Default strictness, deliberately. The gRPC surface is what this exists to
# check, and the default already rejects a call to an RPC the generated stub
# does not declare, a field the message does not have, and a value of the
# wrong type. Turning on strict here would surface hundreds of unrelated
# untyped-def findings and bury the ones that matter.
disable_error_code = [
    # pydantic's own idiom is `@computed_field` stacked on `@property`, and
    # mypy does not support decorators on top of `@property`. Disabled
    # rather than ignored per site, so the next `@computed_field` does not
    # add another ignore line.
    "prop-decorator",
]
